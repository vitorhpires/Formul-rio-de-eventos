<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Evento</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="conteudo">
            <h1>Crie e compartilhe<br>seu evento.</h1>
            <p>O primeiro passo é preencher esse<br>formulário de inscrição.</p>
        </div>
    </header>

    <main class="formulario">
        <form>
            <h2>Informações do Evento</h2>

            <div class="campo">
                <label for="titulo">Título do evento
                    <span>(primeiro é o necessário)</span>
                </label>
                <input type="text" id="titulo" required>
            </div>

            <div class="campo">
                <label for="link">Link do evento
                    <span>(forneça com atenção)</span>
                </label>
                <input type="url" id="link">
            </div>

            <div class="campo">
                <label for="whatsapp">WhatsApp para contato
                    <span>(apenas o número)</span>
                </label>
                <input type="tel" id="whatsapp" class="whatsapp">
            </div>

            <div class="campo">
                <label for="informacoes">Informações extras</label>
                <textarea id="informacoes"></textarea>
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="">Tipo do evento</option>
                    <option value="festa">Festa</option>
                    <option value="show">Show</option>
                    <option value="esporte">Esporte</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <h2>Privacidade</h2>

            <div class="campo">
                <label for="email">E-mail do administrador
                    <span>(digite um e-mail válido)</span>
                </label>
                <input type="email" id="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha de acesso para os participantes
                    <span>(mínimo 6 caracteres)</span>
                </label>
                <input type="password" id="senha" minlength="6">
            </div>

            <div class="privado">
                <input type="checkbox" id="privado" checked>
                <label for="privado">Evento privado</label>
            </div>

            <h2>Dia e hora</h2>

            <div class="data-hora">
                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data">
                </div>

                <div class="campo">
                    <label for="inicio">Hora</label>
                    <input type="time" id="inicio" value="13:00">
                </div>

                <div class="campo">
                    <label for="fim">Até</label>
                    <input type="time" id="fim" value="20:00">
                </div>
            </div>

            <button type="submit">Salvar evento</button>
        </form>
    </main>

</body>
</html>
